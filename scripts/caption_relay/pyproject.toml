[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xaana-caption-relay"
version = "1.0.0"
description = "Scoped residential caption fetching for Xaana"
requires-python = ">=3.10"
dependencies = ["youtube-transcript-api>=1.2,<2", "yt-dlp>=2026.3.17"]

[project.scripts]
xaana-caption-relay = "caption_relay.client:main"

[tool.setuptools]
packages = ["caption_relay"]
package-dir = {caption_relay = "."}
