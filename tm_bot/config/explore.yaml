version: 1

# Explore is organised by SUBJECT, not by kind of content. A category is
# something a person is working on (French, English, Body); a topic is the kind
# of thing inside it. See docs/EXPLORE_CONTENT.md.
#
# Topic ids come from a FIXED vocabulary, in this order, so that the same five
# words mean the same thing in every subject and the client can render them as
# filter chips without knowing anything about a particular category:
#
#   courses (10) · watch (20) · read (30) · decks (40) · habits (50)
#
# A course is a deck that a person releases on a cadence, with a leaderboard.
# Anything self-paced is a deck, however its content is stored — which is why
# French Naturalization Prep sits under `decks` even though it is served by the
# challenge engine: nobody releases it, so there is nothing to wrap.
#
# This catalog is an ALLOWLIST, not a mirror of the database. Nothing appears in
# Explore unless it is written down here, which is what keeps test fixtures and
# half-finished rows out of the tab.
#
# Only globally-valid destinations belong here:
#   * challenges — visibility=public, status=active
#   * templates  — promise_templates with is_active=1
# Per-user rows must NOT be listed: flashcard decks belong to one user_id, and
# your own decks live in Library.
#
# `icon` is the glyph on the subject tile and `accent` tints it. Keep the glyph
# to a single character: the tile sizes it as a face, not as text.

categories:
  - id: french
    title: French
    icon: "🇫🇷"
    accent: "#22D3EE"
    order: 10
    published: true
    topics:
      - id: courses
        title: Courses
        order: 10
        published: true
        items:
          # The club at /c/9b31b136-… is deliberately NOT listed separately.
          # It and this challenge are the same thing at two time scales
          # (docs/CLUBS_MODEL.md §3); listing both put Atena in Explore twice.
          - id: atena-fr
            title: French with Atena 🇫🇷
            type: challenge
            order: 10
            published: true
            description: A short daily French quiz — 10 new questions every day.
            native_ref: /challenges/660762b526d849ffa4470a9e690fc2d3
      - id: watch
        title: Watch
        order: 20
        published: true
        items:
          - id: video-sud-radio-libertinage
            title: "Olivier : C'est la mère de mon fils qui m'a initié au libertinage"
            type: video
            order: 10
            published: true
            description: French subtitles — tap a word to translate, hear it and save a contextual flashcard.
            image: https://img.youtube.com/vi/c4dtEcHyNcc/mqdefault.jpg
            native_ref: /youtube-watch?video_id=c4dtEcHyNcc
          # Transcripts for all of these are cached in video_transcript, which
          # is what the subtitle reader needs — YouTube blocks the VM, so a
          # video with no cached cues opens without its captions. Fetched with
          # scripts/fetch_transcripts.py from a residential connection.
          - id: video-naturalisation-200-questions
            title: "200 questions d'entretien de naturalisation"
            type: video
            order: 20
            published: true
            description: The full interview question set, read aloud — 57 minutes with French subtitles you can tap.
            image: https://img.youtube.com/vi/SM1GSh80SOA/mqdefault.jpg
            native_ref: /youtube-watch?video_id=SM1GSh80SOA
          - id: video-spoken-french-masterclass
            title: "1 Hour Intensive Spoken French Masterclass"
            type: video
            order: 30
            published: true
            description: 41 minutes of spoken French — follow the subtitles and save the words you did not catch.
            image: https://img.youtube.com/vi/ansuNvUgazE/mqdefault.jpg
            native_ref: /youtube-watch?video_id=ansuNvUgazE
          - id: video-whats-in-my-bag
            title: "What's in my bag ? — vocabulaire du quotidien"
            type: video
            order: 40
            published: true
            description: A short everyday-vocabulary lesson, 13 minutes, subtitled in French.
            image: https://img.youtube.com/vi/WiThSUgzvqA/mqdefault.jpg
            native_ref: /youtube-watch?video_id=WiThSUgzvqA
      - id: decks
        title: Decks
        order: 40
        published: true
        items:
          # Self-paced: no coach, no cadence, so it is a deck rather than a
          # course, even though the challenge engine serves its questions.
          - id: fr-naturalization
            title: French Naturalization Prep 🇫🇷
            type: challenge
            order: 10
            published: true
            description: Q&A to prep the French citizenship interview — study at your own pace.
            native_ref: /challenges/8780918c227541c089498430da290c8d

