version: 1

# Explore is organised by SUBJECT, not by kind of content. A category is
# something a person is working on (French, Gym); a topic is the kind of thing
# inside it (quiz, club, habit). See docs/EXPLORE_CONTENT.md.
#
# This catalog is an ALLOWLIST, not a mirror of the database. Nothing appears in
# Explore unless it is written down here, which is what keeps test fixtures and
# half-finished rows out of the tab.
#
# Only globally-valid destinations belong here:
#   * challenges — visibility=public, status=active
#   * clubs      — visibility=public only; /c/<id> returns 404 to non-members
#                  of a private club, so a private club is a dead link
#   * templates  — promise_templates with is_active=1
# Per-user rows must NOT be listed: flashcard decks belong to one user_id, and
# the Explore page already lists the caller's own decks from its own endpoint.
#
# `icon` and `accent` are read by nothing yet — ExploreCategory ignores unknown
# keys. They are here so the tile design has its data when the model gains the
# fields.

categories:
  - id: french
    title: French
    icon: bubble-fr
    accent: "#22D3EE"
    order: 10
    published: true
    topics:
      - id: quizzes
        title: Daily quiz
        order: 10
        published: true
        items:
          - id: atena-fr
            title: French with Atena 🇫🇷
            type: challenge
            order: 10
            published: true
            description: A short daily French quiz — 10 new questions every day.
            native_ref: /challenges/660762b526d849ffa4470a9e690fc2d3
          - id: fr-naturalization
            title: French Naturalization Prep 🇫🇷
            type: challenge
            order: 20
            published: true
            description: Q&A to prep the French citizenship interview — study at your own pace.
            native_ref: /challenges/8780918c227541c089498430da290c8d
      - id: videos
