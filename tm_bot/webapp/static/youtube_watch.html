<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Watch in Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --watch-safe-top: 0px;
      --watch-safe-right: 0px;
      --watch-safe-bottom: 0px;
      --watch-safe-left: 0px;
      --player-safe-top: max(10px, env(safe-area-inset-top, 0px), var(--tg-safe-area-inset-top, 0px), var(--tg-content-safe-area-inset-top, 0px), var(--watch-safe-top));
      --player-safe-right: max(10px, env(safe-area-inset-right, 0px), var(--tg-safe-area-inset-right, 0px), var(--tg-content-safe-area-inset-right, 0px), var(--watch-safe-right));
      --player-safe-bottom: max(10px, env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px), var(--tg-content-safe-area-inset-bottom, 0px), var(--watch-safe-bottom));
      --player-safe-left: max(10px, env(safe-area-inset-left, 0px), var(--tg-safe-area-inset-left, 0px), var(--tg-content-safe-area-inset-left, 0px), var(--watch-safe-left));
      --app-bg: #081225;
      --app-panel: #0f1c37;
      --app-border: rgba(170, 196, 238, 0.16);
      --app-accent: #63a7f7;
      --player-control-rail: clamp(64px, 9vw, 82px);
      --watch-viewport-height: 100dvh;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
      font-family: system-ui, sans-serif;
      background: var(--app-bg);
      color: #edf3ff;
    }
    .video-title {
      font-size: 15px;
      font-weight: 600;
      padding: 0 0 6px;
      color: #edf3ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
      min-height: 1.35em;
    }
    .video-wrap { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden; border: 1px solid var(--app-border); border-radius: 14px; background: #000; box-shadow: 0 18px 48px rgba(0,0,0,.28); }
    .video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .progress-container {
      margin-top: 6px;
      position: relative;
      height: 6px;
      background: rgba(128, 128, 128, 0.18);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-segment {
      position: absolute;
      top: 0;
      height: 100%;
      background: var(--tg-theme-button-color, #2481cc);
      border-radius: 3px;
      opacity: 0.78;
    }
    .transcript { margin-top: 14px; border: 1px solid var(--app-border); border-radius: 12px; background: var(--app-panel); overflow: hidden; }
    .transcript summary { cursor: pointer; padding: 12px 14px; font-size: 13px; font-weight: 800; color: #edf3ff; }
    .transcript-list { max-height: 280px; overflow: auto; border-top: 1px solid var(--app-border); }
    .transcript-cue { display: grid; grid-template-columns: 54px 1fr; gap: 10px; width: 100%; padding: 10px 14px; border: 0; border-bottom: 1px solid rgba(170,196,238,.08); background: transparent; color: rgba(237,243,255,.78); text-align: start; font: inherit; font-size: 13px; cursor: pointer; }
    .transcript-cue:hover, .transcript-cue:focus-visible { background: rgba(99,167,247,.12); color: #fff; outline: none; }
    .transcript-time { color: var(--app-accent); font-variant-numeric: tabular-nums; }
    .transcript-cue.is-active { background: rgba(99,167,247,.18); color: #fff; }
    .transcript-cue.is-active .transcript-time { font-weight: 800; }
    /* The line being spoken, kept large and directly under the video so it can
       be read while watching — the same focus a lyrics view gives a song. */
    .focus-line { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px; border: 1px solid var(--app-border); border-radius: 12px; background: var(--app-panel); }
    .focus-text { flex: 1; margin: 0; font-size: 15px; line-height: 1.5; color: #edf3ff; }
    .focus-text mark { padding: 0 2px; border-radius: 4px; background: rgba(99,167,247,.30); color: #fff; font-weight: 800; }
    .focus-replay { flex: 0 0 auto; min-height: 40px; padding: 8px 12px; border: 1px solid var(--app-border); border-radius: 10px; background: transparent; color: var(--app-accent); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .focus-replay:hover, .focus-replay:focus-visible { background: rgba(99,167,247,.14); outline: none; }
    @media (max-width: 420px) { .focus-line { flex-direction: column; align-items: stretch; } .focus-replay { width: 100%; } }
    .hint { font-size: 12px; color: rgba(237,243,255,.58); margin: 10px 2px 0; }
    .controls { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px; border: 1px solid var(--app-border); border-radius: 12px; background: var(--app-panel); }
    .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; white-space: nowrap; }
    .toggle input { width: 18px; height: 18px; }
    .debug {
      margin-top: 10px;
      padding: 10px;
      font-size: 12px;
      color: var(--tg-theme-text-color, #000);
      background: rgba(0, 0, 0, 0.06);
      background: color-mix(in srgb, var(--tg-theme-bg-color, #fff) 85%, #000 15%);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border: 1px solid color-mix(in srgb, var(--tg-theme-hint-color, #999) 40%, transparent);
      border-radius: 10px;
      white-space: pre-wrap;
      max-height: 160px;
      overflow: auto;
    }
    /* Landscape / immersive mode: mobile only */
    /* Desktop fullscreen mode shares the same immersive layout */
    body.landscape,
    body.desktop-fullscreen {
      min-height: var(--watch-viewport-height);
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    body.landscape .video-wrap,
    body.desktop-fullscreen .video-wrap {
      position: fixed;
      inset:
        var(--player-safe-top)
        calc(var(--player-control-rail) + var(--player-safe-right))
        var(--player-safe-bottom)
        var(--player-safe-left);
      width: auto;
      height: auto;
      padding-bottom: 0;
      z-index: 10;
      background: #000;
    }
    body.landscape .video-title,
    body.landscape .progress-container,
    body.landscape .hint,
    body.landscape .controls,
    body.landscape .debug,
    body.desktop-fullscreen .video-title,
    body.desktop-fullscreen .progress-container,
    body.desktop-fullscreen .hint,
    body.desktop-fullscreen .controls,
    body.desktop-fullscreen .debug { display: none; }
    /* App controls live outside the iframe so they do not cover YouTube controls. */
    .immersive-controls {
      display: none;
      position: fixed;
      z-index: 200;
      top: var(--player-safe-top);
      right: var(--player-safe-right);
      bottom: var(--player-safe-bottom);
      width: calc(var(--player-control-rail) - 8px);
      min-width: 48px;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
    }
    body.landscape .immersive-controls,
    body.desktop-fullscreen .immersive-controls {
      display: flex;
    }
    body.desktop-fullscreen .immersive-controls {
      justify-content: space-between;
    }
    .float-btn {
      display: none;
      position: static;
      width: 100%;
      min-height: 44px;
      padding: 0 8px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      touch-action: manipulation;
      pointer-events: auto;
      line-height: 1.1;
      white-space: normal;
    }
    .float-btn:active { transform: translateY(1px); }
    body.landscape #floatDoneBtn { display: block; }
    body.desktop-fullscreen #floatDoneBtn { display: block; }
    body.desktop-fullscreen #floatExitBtn { display: block; }
    @media (max-height: 380px) and (orientation: landscape) {
      :root { --player-control-rail: 54px; }
      .immersive-controls { gap: 8px; width: 48px; }
      .float-btn {
        min-height: 40px;
        padding: 0 5px;
        font-size: 12px;
      }
    }
    /* Expand / fullscreen toggle button — shown in the controls bar */
    .expand-btn {
      padding: 5px 10px;
      background: transparent;
      color: var(--app-accent);
      border: 1px solid currentColor;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      line-height: 1.2;
      white-space: nowrap;
    }
    .expand-btn:hover { opacity: 0.75; }
  </style>
</head>
<body>
  <div id="videoTitle" class="video-title" hidden></div>
  <div class="video-wrap">
    <iframe id="yt" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>
  <div id="watchProgress" class="progress-container" hidden></div>
  <div id="focusLine" class="focus-line" hidden>
    <p id="focusText" class="focus-text" dir="auto"></p>
    <button id="replayLine" class="focus-replay" type="button"></button>
  </div>
  <details id="transcript" class="transcript" hidden>
    <summary id="transcriptTitle">Transcript</summary>
    <div id="transcriptList" class="transcript-list"></div>
  </details>
  <p id="doneHint" class="hint">When you’re finished, close this page to save your watch progress.</p>
  <div class="controls">
    <label class="toggle">
      <input type="checkbox" id="trackToggle" checked>
      <span id="trackLabel">Track progress</span>
    </label>
    <span id="trackHint" class="hint">Save the parts you watch.</span>
    <button id="expandBtn" class="expand-btn" hidden>Full screen</button>
  </div>
  <pre id="debugLog" class="debug" hidden></pre>

  <div id="immersiveControls" class="immersive-controls" aria-label="Player controls">
    <!-- Floating Done button: shown beside the video in landscape / fullscreen modes -->
    <button id="floatDoneBtn" class="float-btn" title="Close and save" aria-label="Close and save">Close</button>
    <!-- Floating Exit button: shown beside the video in desktop fullscreen mode -->
    <button id="floatExitBtn" class="float-btn" title="Exit full screen" aria-label="Exit full screen">Exit</button>
  </div>

  <script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var videoId = params.get('video_id') || '';
  var contentId = params.get('content_id') || '';
  // Flashcards mined from this video link straight to the second the word
  // is spoken, so honour a ?start= offset when opening the player.
  var startAt = Math.max(0, parseInt(params.get('start') || '0', 10) || 0);
  // A flashcard links here for one word; we highlight it in the spoken line.
  var focusWord = params.get('word') || '';
  var language = (params.get('lang') || 'en').toLowerCase().split('-')[0];
  var copy = language === 'fa' ? {
    hint: 'پس از پایان، این صفحه را ببندید تا پیشرفت تماشا ذخیره شود.', track: 'ردگیری پیشرفت',
    trackHint: 'بخش‌هایی را که می‌بینید ذخیره می‌کنیم.', full: 'تمام‌صفحه', close: 'بستن و ذخیره', exit: 'خروج',
    replay: '↺ تکرار این جمله'
  } : {
    hint: 'When you’re finished, close this page to save your watch progress.', track: 'Track progress',
    trackHint: 'Save the parts you watch.', full: 'Full screen', close: 'Close and save', exit: 'Exit',
    replay: '↺ Replay this line'
  };
  document.documentElement.lang = language;
  document.documentElement.dir = language === 'fa' ? 'rtl' : 'ltr';
  document.getElementById('doneHint').textContent = copy.hint;
  document.getElementById('replayLine').textContent = copy.replay;
  document.getElementById('replayLine').addEventListener('click', function() { replayCurrentLine(); });
  document.getElementById('trackLabel').textContent = copy.track;
  document.getElementById('trackHint').textContent = copy.trackHint;
  document.getElementById('expandBtn').textContent = copy.full;
  document.getElementById('floatDoneBtn').textContent = copy.close;
  document.getElementById('floatDoneBtn').title = copy.close;
  document.getElementById('floatDoneBtn').setAttribute('aria-label', copy.close);
  document.getElementById('floatExitBtn').textContent = copy.exit;
  var userToken = params.get('ut') || '';
  var promiseId = params.get('pid') || '';
  var debug = params.get('debug') === '1';
  var baseUrl = window.location.origin;
  var openTime = Date.now();
  var segments = [];
  var currentStart = null;
  var player = null;
  var currentlyPlaying = false;
  var trackToggle = document.getElementById('trackToggle');
  var trackingEnabled = trackToggle ? !!trackToggle.checked : true;
  var pollTimer = null;
  var lastPlayerTime = null;
  var statsSent = false;
  var immersiveLandscape = false;
  var videoDuration = 0;
  var cues = [];
  var activeCueIndex = -1;
  var cueButtons = [];
  var followTimer = null;
  var debugLog = document.getElementById('debugLog');
  if (debug && debugLog) debugLog.hidden = false;

  function formatCueTime(seconds) {
    var total = Math.max(0, Math.floor(Number(seconds) || 0));
    var minutes = Math.floor(total / 60);
    var secs = String(total % 60).padStart(2, '0');
    return minutes + ':' + secs;
  }

  // --- transcript follow -----------------------------------------------
  // Song-learning apps make the current line the centre of the screen and let
  // you replay it without hunting the scrubber. That is the whole trick for
  // learning in context, so the line the player is on is always shown large
  // above the transcript, and one button repeats it.

  function foldAccents(text) {
    try { return text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
    catch (e) { return text.toLowerCase(); }
  }

  // "une decennie" -> "decenn": drop the article, keep a stem short enough to
  // survive French inflection (decennie/decennies, aggraver/aggrave).
  function wordStem() {
    var stem = foldAccents(focusWord).replace(/^(un|une|le|la|les|des|du|de|d')\s*/, '').split(/[\s(,]/)[0];
    return stem.length > 4 ? stem.slice(0, Math.max(4, stem.length - 2)) : stem;
  }

  // Emphasise the linked word inside its sentence, accent- and case-insensitively.
  function renderFocusText(text) {
    var target = document.getElementById('focusText');
    target.textContent = '';
    var stem = wordStem();
    if (!stem) { target.textContent = text; return; }
    var folded = foldAccents(text);
    var at = folded.indexOf(stem);
    if (at < 0) { target.textContent = text; return; }
    // Grow the match to the whole word so the highlight lands on a word, not a stem.
    var end = at + stem.length;
    while (end < text.length && /[\w'’-]/.test(text[end])) end++;
    var begin = at;
    while (begin > 0 && /[\w'’-]/.test(text[begin - 1])) begin--;
    target.appendChild(document.createTextNode(text.slice(0, begin)));
    var mark = document.createElement('mark');
    mark.textContent = text.slice(begin, end);
    target.appendChild(mark);
    target.appendChild(document.createTextNode(text.slice(end)));
  }

  function setActiveCue(index) {
    if (index === activeCueIndex || index < 0 || index >= cues.length) return;
    if (cueButtons[activeCueIndex]) cueButtons[activeCueIndex].classList.remove('is-active');
    activeCueIndex = index;
    var button = cueButtons[index];
    if (button) {
      button.classList.add('is-active');
      // Only chase the line when the panel is open, or we fight the user's scroll.
      var panel = document.getElementById('transcript');
      if (panel && panel.open) {
        try { button.scrollIntoView({block: 'center', behavior: 'smooth'}); } catch (e) {}
      }
    }
    renderFocusText(cues[index].text);
    document.getElementById('focusLine').hidden = false;
  }

  function cueIndexAt(seconds) {
    var lo = 0, hi = cues.length - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (cues[mid].start <= seconds) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return best;
  }

  // The card links a second early on purpose, and our transcript can drift from
  // the one the word was mined out of, so find the line that actually says the
  // word near that point rather than trusting the timestamp alone.
  function initialCueIndex() {
    var fallback = cueIndexAt(startAt + 0.5);
    var stem = wordStem();
    if (!stem) return fallback;
    for (var i = 0; i < cues.length; i++) {
      if (cues[i].start < startAt - 4) continue;
      if (cues[i].start > startAt + 20) break;
      if (foldAccents(cues[i].text).indexOf(stem) >= 0) return i;
    }
    return fallback;
  }

  function followTick() {
    if (!cues.length || !player || typeof player.getCurrentTime !== 'function') return;
    // Only chase the clock while the video is actually running. Paused, the
    // line must stay put: it is the one the flashcard linked to, and the
    // player sits a beat before it by design.
    try {
      if (!window.YT || !YT.PlayerState || player.getPlayerState() !== YT.PlayerState.PLAYING) return;
    } catch (e) { return; }
    var t;
    try { t = player.getCurrentTime(); } catch (e) { return; }
    setActiveCue(cueIndexAt(t));
  }

  function startFollowing() {
    if (followTimer) return;
    // Faster than the 1s stats poll: a caption line can be shorter than a second.
    followTimer = setInterval(followTick, 250);
    followTick();
  }

  function replayCurrentLine() {
    var cue = cues[activeCueIndex];
    if (!cue || !player) return;
    try {
      player.seekTo(Math.max(0, cue.start - 0.35), true);
      player.playVideo();
    } catch (e) {}
  }

  function loadTranscript() {
    var headers = {};
    var token = '';
    try { token = localStorage.getItem('telegram_auth_token') || ''; } catch (_) {}
    var initData = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData;
    if (token) headers.Authorization = 'Bearer ' + token;
    else if (initData) headers['X-Telegram-Init-Data'] = initData;
    var endpoint = contentId
      ? '/api/content/' + encodeURIComponent(contentId) + '/transcript'
      : '/api/youtube/' + encodeURIComponent(videoId) + '/transcript';
    fetch(baseUrl + endpoint, { headers: headers })
      .then(function(response) { return response.ok ? response.json() : null; })
      .then(function(data) {
        if (!data || !data.available || !data.cues || !data.cues.length) return;
        var panel = document.getElementById('transcript');
        var list = document.getElementById('transcriptList');
        var title = document.getElementById('transcriptTitle');
        title.textContent = (language === 'fa' ? 'زیرنویس' : 'Transcript') + (data.source === 'automatic' ? (language === 'fa' ? ' · خودکار' : ' · automatic') : '');
        list.innerHTML = '';
        cues = data.cues.map(function(cue) {
          return {start: Number(cue.start) || 0, end: Number(cue.end) || 0, text: cue.text || ''};
        });
        cueButtons = [];
        cues.forEach(function(cue, index) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'transcript-cue';
          button.innerHTML = '<span class="transcript-time">' + formatCueTime(cue.start) + '</span><span></span>';
          button.querySelector('span:last-child').textContent = cue.text;
          button.addEventListener('click', function() {
            if (player && typeof player.seekTo === 'function') { player.seekTo(cue.start, true); player.playVideo(); }
            setActiveCue(index);
          });
          cueButtons.push(button);
          list.appendChild(button);
        });
        panel.hidden = false;
        // Opening the panel should land on the line being spoken, not at 0:00.
        panel.addEventListener('toggle', function() {
          if (!panel.open) return;
          var active = cueButtons[activeCueIndex];
          if (active) { try { active.scrollIntoView({block: 'center'}); } catch (e) {} }
        });
        // Show the linked line immediately, before playback reports a position.
        if (startAt > 0) setActiveCue(initialCueIndex());
        startFollowing();
      })
      .catch(function() { /* Captions are optional; keep the player usable. */ });
  }

  // Detect mobile (Android/iOS) vs desktop — only mobile gets landscape/fullscreen handling.
  var isMobileDevice = (function() {
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        var p = (window.Telegram.WebApp.platform || '').toLowerCase();
        if (p === 'android' || p === 'ios' || p === 'android_x' || p === 'ios_x') return true;
        if (p) return false; // any other known platform is desktop/web
      }
    } catch (e) {}
    return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  }());

  function dlog(msg) {
    if (!debug) return;
    var line = new Date().toISOString().slice(11, 19) + " " + msg;
    try { console.log("[yt-watch]", line); } catch (e) {}
    if (debugLog) {
      debugLog.textContent += line + "\n";
      debugLog.scrollTop = debugLog.scrollHeight;
    }
  }

  window.addEventListener("error", function(e) {
    dlog("window.error: " + (e && e.message ? e.message : "unknown"));
  });
  window.addEventListener("unhandledrejection", function(e) {
    dlog("unhandledrejection: " + (e && e.reason ? String(e.reason) : "unknown"));
  });

  function setRootPxVar(name, value) {
    var n = Number(value);
    if (!isFinite(n) || n < 0) return;
    document.documentElement.style.setProperty(name, n + "px");
  }

  function syncTelegramLayoutVars() {
    try {
      if (!window.Telegram || !window.Telegram.WebApp) return;
      var webApp = window.Telegram.WebApp;
      if (typeof webApp.viewportHeight === "number" && webApp.viewportHeight > 0) {
        setRootPxVar("--watch-viewport-height", webApp.viewportHeight);
      }
      var safe = webApp.safeAreaInset || {};
      var contentSafe = webApp.contentSafeAreaInset || {};
      ["top", "right", "bottom", "left"].forEach(function(side) {
        var safeValue = Number(safe[side]) || 0;
        var contentValue = Number(contentSafe[side]) || 0;
        setRootPxVar("--watch-safe-" + side, Math.max(safeValue, contentValue));
      });
    } catch (e) {
      dlog("layout sync failed: " + e);
    }
  }

  function installTelegramLayoutSync() {
    syncTelegramLayoutVars();
    try {
      if (!window.Telegram || !window.Telegram.WebApp || typeof window.Telegram.WebApp.onEvent !== "function") return;
      var webApp = window.Telegram.WebApp;
      ["viewportChanged", "safeAreaChanged", "contentSafeAreaChanged", "fullscreenChanged"].forEach(function(eventName) {
        webApp.onEvent(eventName, function() {
          syncTelegramLayoutVars();
          if (eventName === "fullscreenChanged") setTimeout(updateOrientationMode, 0);
        });
      });
    } catch (e) {
      dlog("layout event install failed: " + e);
    }
  }

  function requestTelegramFullscreen() {
    try {
      if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.requestFullscreen === "function") {
        window.Telegram.WebApp.requestFullscreen();
        dlog("fullscreen: requested via Telegram");
        return true;
      }
    } catch (e) {
      dlog("fullscreen: telegram request failed: " + e);
    }
    return false;
  }

  function exitTelegramFullscreen() {
    try {
      if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.exitFullscreen === "function") {
        window.Telegram.WebApp.exitFullscreen();
        dlog("fullscreen: exited via Telegram");
        return true;
      }
    } catch (e) {
      dlog("fullscreen: telegram exit failed: " + e);
    }
    return false;
  }

  function requestBrowserFullscreen() {
    var root = document.documentElement;
    var fn = root.requestFullscreen || root.webkitRequestFullscreen || root.msRequestFullscreen;
    if (!fn) return false;
    try {
      fn.call(root);
      dlog("fullscreen: requested via browser api");
      return true;
    } catch (e) {
      dlog("fullscreen: browser request failed: " + e);
      return false;
    }
  }

  function exitBrowserFullscreen() {
    var fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (!fn) return false;
    if (!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement)) {
      return false;
    }
    try {
      fn.call(document);
      dlog("fullscreen: exited via browser api");
      return true;
    } catch (e) {
      dlog("fullscreen: browser exit failed: " + e);
      return false;
    }
  }

  function isLandscape() {
    try {
      if (window.matchMedia && window.matchMedia("(orientation: landscape)").matches) return true;
    } catch (e) {}
    return window.innerWidth > window.innerHeight;
  }

  function updateOrientationMode() {
    syncTelegramLayoutVars();
    // Only apply immersive landscape mode on mobile devices. On desktop the
    // fixed-position overlay covers the window's resize handles and freezes them.
    if (!isMobileDevice) return;
    var landscape = isLandscape();
    if (landscape === immersiveLandscape) return;
    immersiveLandscape = landscape;
    if (landscape) {
      document.body.classList.add("landscape");
      if (!requestTelegramFullscreen()) {
        requestBrowserFullscreen();
      }
      // Hide the Telegram MainButton in landscape — it takes too much space.
      // A small floating Done button is shown via CSS instead.
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.MainButton.hide();
        }
      } catch (e) {}
      dlog("orientation: landscape immersive=on");
    } else {
      document.body.classList.remove("landscape");
      if (!exitTelegramFullscreen()) {
        exitBrowserFullscreen();
      }
      // Restore the Telegram MainButton when returning to portrait.
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.MainButton.show();
        }
      } catch (e) {}
      dlog("orientation: portrait immersive=off");
    }
  }

  installTelegramLayoutSync();
  window.addEventListener("orientationchange", function() {
    setTimeout(function() {
      syncTelegramLayoutVars();
      updateOrientationMode();
    }, 120);
  });
  window.addEventListener("resize", function() {
    syncTelegramLayoutVars();
    updateOrientationMode();
  });
  updateOrientationMode();

  if (!videoId) {
    document.body.innerHTML = '<p>Missing video_id.</p>';
    return;
  }

  dlog("init: video_id=" + videoId + " trackingEnabled=" + trackingEnabled + " tg=" + (!!(window.Telegram && window.Telegram.WebApp)));

  document.getElementById('yt').src =
    'https://www.youtube.com/embed/' + videoId +
    '?enablejsapi=1&playsinline=1&origin=' + encodeURIComponent(baseUrl) +
    (startAt > 0 ? '&start=' + startAt : '');

  // Fetch video title via YouTube oEmbed (no API key required).
  (function() {
    var titleEl = document.getElementById('videoTitle');
    if (!titleEl) return;
    var oembedUrl = 'https://www.youtube.com/oembed?url=' +
      encodeURIComponent('https://www.youtube.com/watch?v=' + videoId) + '&format=json';
    fetch(oembedUrl).then(function(r) {
      if (!r.ok) throw new Error('oEmbed HTTP ' + r.status);
      return r.json();
    }).then(function(data) {
      if (data && data.title) {
        titleEl.textContent = data.title;
        titleEl.hidden = false;
        titleEl.title = data.title;
        dlog("title: " + data.title);
      }
    }).catch(function(e) {
      dlog("title fetch failed: " + e);
    });
  }());

  function pushSegment(start, end) {
    if (typeof start !== "number" || typeof end !== "number") return;
    if (!isFinite(start) || !isFinite(end)) return;
    if (end <= start) return;
    var last = segments.length ? segments[segments.length - 1] : null;
    if (last && typeof last[0] === "number" && typeof last[1] === "number" && start <= (last[1] + 1.5)) {
      last[0] = Math.min(last[0], start);
      last[1] = Math.max(last[1], end);
      updateProgressDisplay();
      return;
    }
    segments.push([start, end]);
    updateProgressDisplay();
  }

  function updateProgressDisplay() {
    var container = document.getElementById('watchProgress');
    if (!container) return;
    if (!videoDuration || !segments.length) { container.hidden = true; return; }
    container.hidden = false;
    container.innerHTML = '';
    segments.forEach(function(seg) {
      var left = (seg[0] / videoDuration) * 100;
      var width = ((seg[1] - seg[0]) / videoDuration) * 100;
      if (width <= 0) return;
      var div = document.createElement('div');
      div.className = 'progress-segment';
      div.style.left = Math.max(0, Math.min(100, left)) + '%';
      div.style.width = Math.max(0, Math.min(100 - Math.max(0, left), width)) + '%';
      container.appendChild(div);
    });
  }

  function markPlaying(t) {
    if (!trackingEnabled) return;
    if (currentlyPlaying) return;
    if (typeof t !== "number" || !isFinite(t)) {
      try { t = player ? player.getCurrentTime() : 0; } catch (e) { t = 0; }
    }
    currentlyPlaying = true;
    currentStart = t;
    dlog("play @" + t.toFixed(2));
  }

  function markNotPlaying(t) {
    if (!currentlyPlaying) return;
    if (typeof t !== "number" || !isFinite(t)) {
      try { t = player ? player.getCurrentTime() : 0; } catch (e) { t = 0; }
    }
    currentlyPlaying = false;
    if (currentStart != null) pushSegment(currentStart, t);
    dlog("stop @" + t.toFixed(2));
    currentStart = null;
  }

  function pollTick() {
    if (!trackingEnabled) return;
    if (!player || typeof player.getCurrentTime !== "function") return;
    var t;
    try {
      t = player.getCurrentTime();
    } catch (e) {
      dlog("poll: getCurrentTime failed: " + e);
      return;
    }
    var state = null;
    try {
      state = player.getPlayerState();
    } catch (e) {}

    var advanced = (lastPlayerTime != null) && (t > (lastPlayerTime + 0.2));
    var isPlaying = false;
    if (typeof state === "number" && window.YT && YT.PlayerState) {
      isPlaying = state === YT.PlayerState.PLAYING;
    }
    if (!isPlaying && advanced) isPlaying = true;

    var jumped = (lastPlayerTime != null) && (Math.abs(t - lastPlayerTime) > 2.5);
    if (currentlyPlaying && jumped && lastPlayerTime != null && currentStart != null) {
      pushSegment(currentStart, lastPlayerTime);
      currentStart = t;
      dlog("jump: " + lastPlayerTime.toFixed(2) + " -> " + t.toFixed(2));
    }

    if (isPlaying) markPlaying(t);
    else markNotPlaying(t);
    lastPlayerTime = t;
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(pollTick, 1000);
    pollTick();
    dlog("poll: started");
  }

  function stopPolling() {
    if (!pollTimer) return;
    clearInterval(pollTimer);
    pollTimer = null;
    dlog("poll: stopped");
  }

  if (trackToggle) {
    trackToggle.addEventListener("change", function() {
      trackingEnabled = !!trackToggle.checked;
      dlog("trackingEnabled=" + trackingEnabled);
      if (!trackingEnabled) {
        stopPolling();
        markNotPlaying();
      } else {
        startPolling();
      }
    });
  }
  if (trackingEnabled) startPolling();

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  setTimeout(function() {
    if (!window.YT || !window.YT.Player) dlog("YT API not loaded (timeout)");
  }, 5000);

  window.onYouTubeIframeAPIReady = function() {
    dlog("YT iframe API ready");
    player = new YT.Player('yt', {
      events: {
        onReady: function() {
          dlog("player ready");
          if (startAt > 0) {
            try { player.seekTo(startAt, true); } catch (e) {}
          }
          try {
            var dur = player.getDuration();
            if (dur && isFinite(dur) && dur > 0) {
              videoDuration = dur;
              dlog("duration=" + dur.toFixed(1));
              updateProgressDisplay();
            }
          } catch (e) {}
        },
        onStateChange: function(event) {
          dlog("state=" + event.data);
          // Capture duration once the video starts playing (may not be available in onReady).
          if (!videoDuration) {
            try {
              var dur = player.getDuration();
              if (dur && isFinite(dur) && dur > 0) {
                videoDuration = dur;
                updateProgressDisplay();
              }
            } catch (e) {}
          }
          if (!trackingEnabled) return;
          if (event.data === YT.PlayerState.PLAYING) {
            try { markPlaying(player.getCurrentTime()); } catch (e) { markPlaying(); }
          } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
            try { markNotPlaying(player.getCurrentTime()); } catch (e) { markNotPlaying(); }
          }
        },
        onError: function(event) {
          dlog("player error=" + (event && event.data != null ? event.data : "unknown"));
        }
      }
    });
  };

  function finalizeSegments() {
    try {
      if (player && typeof player.getCurrentTime === "function") {
        markNotPlaying(player.getCurrentTime());
      }
    } catch (e) {
      markNotPlaying();
    }
  }

  function getPayload(closedVia) {
    finalizeSegments();
    var normalized = [];
    segments.forEach(function(seg) {
      if (seg && seg.length >= 2 && isFinite(seg[0]) && isFinite(seg[1])) {
        var start = Math.min(seg[0], seg[1]);
        var end = Math.max(seg[0], seg[1]);
        if (end > start) normalized.push([start, end]);
      }
    });
    normalized.sort(function(a, b) { return a[0] - b[0]; });
    var merged = [];
    normalized.forEach(function(seg) {
      var last = merged.length ? merged[merged.length - 1] : null;
      if (!last || seg[0] > last[1]) {
        merged.push([seg[0], seg[1]]);
      } else {
        last[1] = Math.max(last[1], seg[1]);
      }
    });
    var watchedSeconds = 0;
    merged.forEach(function(seg) { watchedSeconds += (seg[1] - seg[0]); });
    return {
      init_data: window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData : '',
      user_token: userToken,
      stats: {
        video_id: videoId,
        promise_id: promiseId,
        time_spent_seconds: watchedSeconds,
        page_open_seconds: (Date.now() - openTime) / 1000,
        segments: segments,
        closed_via: closedVia
      }
    };
  }

  function sendBeaconStats(closedVia) {
    if (statsSent) return;
    statsSent = true;
    var payload = getPayload(closedVia);
    try {
      var blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
      navigator.sendBeacon(baseUrl + '/api/youtube/report_stats', blob);
      dlog("beacon sent: " + closedVia);
    } catch (e) {
      try {
        navigator.sendBeacon(baseUrl + '/api/youtube/report_stats', JSON.stringify(payload));
        dlog("beacon sent (string): " + closedVia);
      } catch (e2) {
        dlog("beacon failed: " + e2);
      }
    }
  }

  window.addEventListener('pagehide', function() {
    sendBeaconStats('beacon');
    stopPolling();
  });

  // ── Helper: perform the "Done" action (send stats + close mini app) ──────────
  function handleDone() {
    if (statsSent) {
      if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.close();
      return;
    }
    statsSent = true;
    // Disable floating button immediately to prevent accidental double-taps
    if (floatDoneBtn) floatDoneBtn.disabled = true;
    var payload = getPayload('done');
    fetch(baseUrl + '/api/youtube/report_stats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function() {
      dlog("fetch sent: done");
      if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.close();
    }).catch(function() {
      dlog("fetch failed; falling back to beacon");
      sendBeaconStats('done_beacon');
      if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.close();
    });
  }

  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
    syncTelegramLayoutVars();
    setTimeout(updateOrientationMode, 60);
    window.Telegram.WebApp.MainButton.setText(copy.close).show().onClick(handleDone);
  }

  // ── Floating Done button (landscape / desktop-fullscreen overlay) ────────────
  var floatDoneBtn = document.getElementById('floatDoneBtn');
  if (floatDoneBtn) {
    floatDoneBtn.addEventListener('click', handleDone);
  }

  // ── Expand / fullscreen button (desktop) ─────────────────────────────────────
  var expandBtn = document.getElementById('expandBtn');
  var floatExitBtn = document.getElementById('floatExitBtn');

  function enterDesktopFullscreen() {
    if (!requestTelegramFullscreen()) requestBrowserFullscreen();
    document.body.classList.add('desktop-fullscreen');
    // Hide the Telegram MainButton while the page is in its own fullscreen state.
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.MainButton.hide();
      }
    } catch (e) {}
    dlog("desktop: entered fullscreen");
  }

  function exitDesktopFullscreen() {
    if (!exitTelegramFullscreen()) exitBrowserFullscreen();
    document.body.classList.remove('desktop-fullscreen');
    // Restore the Telegram MainButton.
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.MainButton.show();
      }
    } catch (e) {}
    dlog("desktop: exited fullscreen");
  }

  if (!isMobileDevice && expandBtn) {
    expandBtn.hidden = false;
    expandBtn.addEventListener('click', function() {
      enterDesktopFullscreen();
    });
  }

  if (floatExitBtn) {
    floatExitBtn.addEventListener('click', function() {
      exitDesktopFullscreen();
    });
  }

  loadTranscript();

  // Keep desktop-fullscreen class in sync with the browser's actual fullscreen state.
  function onFullscreenChange() {
    syncTelegramLayoutVars();
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      document.body.classList.remove('desktop-fullscreen');
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.MainButton.show();
        }
      } catch (e) {}
    }
  }
  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);
})();
  </script>
</body>
</html>
