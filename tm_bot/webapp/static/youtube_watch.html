<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch in Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :root {
      --watch-safe-top: 0px;
      --watch-safe-right: 0px;
      --watch-safe-bottom: 0px;
      --watch-safe-left: 0px;
      --player-safe-top: max(10px, env(safe-area-inset-top, 0px), var(--tg-safe-area-inset-top, 0px), var(--tg-content-safe-area-inset-top, 0px), var(--watch-safe-top));
      --player-safe-right: max(10px, env(safe-area-inset-right, 0px), var(--tg-safe-area-inset-right, 0px), var(--tg-content-safe-area-inset-right, 0px), var(--watch-safe-right));
      --player-safe-bottom: max(10px, env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px), var(--tg-content-safe-area-inset-bottom, 0px), var(--watch-safe-bottom));
      --player-safe-left: max(10px, env(safe-area-inset-left, 0px), var(--tg-safe-area-inset-left, 0px), var(--tg-content-safe-area-inset-left, 0px), var(--watch-safe-left));
      --app-bg: #081225;
      --app-panel: #0f1c37;
      --app-border: rgba(170, 196, 238, 0.16);
      --app-accent: #63a7f7;
      --watch-viewport-height: 100dvh;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
      font-family: system-ui, sans-serif;
      background: var(--app-bg);
      color: #edf3ff;
    }
    .watch-header { display: flex; align-items: center; gap: 8px; min-height: 34px; }
    .watch-back {
      flex: 0 0 auto; min-width: 34px; min-height: 34px; padding: 0 9px;
      border: 1px solid var(--app-border); border-radius: 9px; background: transparent;
      color: #edf3ff; font: inherit; font-size: 18px; cursor: pointer;
    }
    .watch-back:hover, .watch-back:focus-visible { background: rgba(99,167,247,.14); outline: none; }
    .video-title {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      padding: 0 0 6px;
      color: #edf3ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
      min-height: 1.35em;
    }
    .video-wrap { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden; border: 1px solid var(--app-border); border-radius: 14px; background: #000; box-shadow: 0 18px 48px rgba(0,0,0,.28); }
    .video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    /* Shown until the YouTube player reports ready. Where YouTube is blocked
       the frame would otherwise stay black with no explanation. It never
       takes pointer events, so a slow-but-working player is never covered. */
    .video-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; color: rgba(237,243,255,.72); font-size: 13px; line-height: 1.5; background: #000; pointer-events: none; z-index: 1; }
    .progress-container {
      margin-top: 6px;
      position: relative;
      height: 6px;
      background: rgba(128, 128, 128, 0.18);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-segment {
      position: absolute;
      top: 0;
      height: 100%;
      background: var(--tg-theme-button-color, #2481cc);
      border-radius: 3px;
      opacity: 0.78;
    }
    .transcript { margin-top: 14px; border: 1px solid var(--app-border); border-radius: 12px; background: var(--app-panel); overflow: hidden; }
    .transcript summary { cursor: pointer; padding: 12px 14px; font-size: 13px; font-weight: 800; color: #edf3ff; }
    .transcript-list { max-height: min(46vh, 420px); overflow: auto; overscroll-behavior: contain; overflow-anchor: none; border-top: 1px solid var(--app-border); }
    .transcript-status { padding: 0 14px 12px; color: rgba(237,243,255,.65); font-size: 13px; line-height: 1.5; }
    .transcript-retry { margin-inline-start: 8px; border: 0; background: transparent; color: var(--app-accent); font: inherit; text-decoration: underline; cursor: pointer; }
    .transcript-cue { display: grid; grid-template-columns: 44px 1fr; gap: 8px; width: 100%; padding: 6px 12px; border-bottom: 1px solid rgba(170,196,238,.08); background: transparent; color: rgba(237,243,255,.78); text-align: start; font: inherit; font-size: 13px; }
    .transcript-cue:hover, .transcript-cue:focus-within { background: rgba(99,167,247,.12); color: #fff; outline: none; }
    .transcript-jump { align-self: start; padding: 0; border: 0; background: transparent; color: var(--app-accent); font: inherit; font-size: 12px; text-align: start; cursor: pointer; }
    .transcript-jump:hover, .transcript-jump:focus-visible { text-decoration: underline; outline: none; }
    .transcript-text { min-width: 0; line-height: 1.45; }
    .transcript-word { padding: 1px 2px; border: 0; border-radius: 4px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    /* Hover only hints that a word is tappable; nothing opens until a click. */
    .transcript-word:hover { text-decoration: underline; text-decoration-color: rgba(99,167,247,.6); text-underline-offset: 3px; }
    .transcript-word:focus-visible, .transcript-word.is-selected { background: rgba(99,167,247,.28); color: #fff; outline: none; }
    .transcript-word.is-focus { background: rgba(99,167,247,.30); color: #fff; font-weight: 800; }
    .transcript-time { color: var(--app-accent); font-variant-numeric: tabular-nums; }
    .transcript-cue.is-active { background: rgba(99,167,247,.18); color: #fff; }
    .transcript-cue.is-active .transcript-time { font-weight: 800; }
    /* Compact word card: word + translation on the left, icon actions on the
       right, one row. Status text only takes space when there is something to say. */
    .word-tools { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 8px 8px 12px; border: 1px solid rgba(99,167,247,.36); border-radius: 12px; background: rgba(20,38,72,.98); }
    .word-body { flex: 1; min-width: 0; }
    .word-heading { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .selected-word { font-size: 16px; font-weight: 800; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .word-context { color: rgba(237,243,255,.46); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .word-translation { margin-top: 1px; color: #d9e8ff; font-size: 13px; line-height: 1.4; }
    .word-status { margin-top: 2px; color: rgba(237,243,255,.58); font-size: 11px; }
    .word-status:empty { display: none; }
    .word-actions { display: flex; flex: 0 0 auto; gap: 4px; }
    .word-action { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border: 1px solid var(--app-border); border-radius: 10px; background: rgba(99,167,247,.10); color: #dceaff; font: inherit; font-size: 16px; line-height: 1; cursor: pointer; }
    .word-action:hover, .word-action:focus-visible { background: rgba(99,167,247,.24); outline: none; }
    .word-action:disabled { cursor: default; opacity: .55; }
    .word-action.is-close { background: transparent; color: rgba(237,243,255,.7); }
    /* Words saved from this video: proof the ＋ worked, a way back to each
       moment, and a link to review them. Saved words are also underlined in
       the transcript itself. */
    .transcript-word.is-saved { text-decoration: underline; text-decoration-color: #7ee0a1; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .saved-words { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--app-border); border-radius: 12px; background: var(--app-panel); }
    .saved-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .saved-title { font-size: 13px; font-weight: 800; color: #edf3ff; }
    .saved-review { color: var(--app-accent); font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; }
    .saved-review:hover, .saved-review:focus-visible { text-decoration: underline; outline: none; }
    .saved-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .saved-chip { display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%; padding: 5px 9px; border: 1px solid rgba(126,224,161,.35); border-radius: 999px; background: rgba(126,224,161,.08); color: #edf3ff; font: inherit; font-size: 13px; cursor: pointer; }
    .saved-chip:hover, .saved-chip:focus-visible { background: rgba(126,224,161,.18); outline: none; }
    .saved-chip-back { color: rgba(237,243,255,.6); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .debug {
      margin-top: 10px;
      padding: 10px;
      font-size: 12px;
      color: var(--tg-theme-text-color, #000);
      background: rgba(0, 0, 0, 0.06);
      background: color-mix(in srgb, var(--tg-theme-bg-color, #fff) 85%, #000 15%);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border: 1px solid color-mix(in srgb, var(--tg-theme-hint-color, #999) 40%, transparent);
      border-radius: 10px;
      white-space: pre-wrap;
      max-height: 160px;
      overflow: auto;
    }
    /* Landscape / immersive mode: mobile only */
    /* Desktop fullscreen mode shares the same immersive layout */
    body.landscape {
      min-height: var(--watch-viewport-height);
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    body.landscape .video-wrap {
      position: fixed;
      inset:
        var(--player-safe-top)
        var(--player-safe-right)
        var(--player-safe-bottom)
        var(--player-safe-left);
      width: auto;
      height: auto;
      padding-bottom: 0;
      z-index: 10;
      background: #000;
    }
    body.landscape .watch-header,
    body.landscape .progress-container,
    body.landscape .debug { display: none; }
  </style>
</head>
<body>
  <div class="watch-header">
    <button id="backBtn" class="watch-back" type="button" aria-label="Back">←</button>
    <div id="videoTitle" class="video-title" hidden></div>
  </div>
  <div class="video-wrap">
    <iframe title="YouTube video player" id="yt" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <div id="videoStatus" class="video-status" role="status"></div>
  </div>
  <div id="watchProgress" class="progress-container" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden></div>
  <p id="watchSaveStatus" role="status" hidden></p>
  <div id="wordTools" class="word-tools" hidden>
    <div class="word-body">
      <div class="word-heading">
        <span id="selectedWord" class="selected-word" dir="auto"></span>
        <span id="wordContext" class="word-context"></span>
      </div>
      <div id="wordTranslation" class="word-translation" dir="auto"></div>
      <div id="wordStatus" class="word-status" role="status"></div>
    </div>
    <div class="word-actions">
      <button id="listenWord" class="word-action" type="button">🔊</button>
      <button id="saveWord" class="word-action" type="button">＋</button>
      <button id="closeWord" class="word-action is-close" type="button">✕</button>
    </div>
  </div>
  <details id="transcript" class="transcript" open hidden>
    <summary id="transcriptTitle">Transcript</summary>
    <div id="transcriptStatus" class="transcript-status"><span id="transcriptMessage" role="status"></span><button id="transcriptRetry" class="transcript-retry" type="button" hidden></button></div>
    <div id="transcriptList" class="transcript-list" hidden></div>
  </details>
  <section id="savedWords" class="saved-words" hidden>
    <div class="saved-head">
      <span id="savedTitle" class="saved-title"></span>
      <a id="savedReview" class="saved-review" href="#"></a>
    </div>
    <div id="savedList" class="saved-list"></div>
  </section>
  <pre id="debugLog" class="debug" hidden></pre>

  <script>
(function() {
  var params = new URLSearchParams(window.location.search);
  // Telegram Desktop can omit WebApp.initData for inline buttons. Watch links
  // carry the short-lived browser session in the URL fragment, so preserve it
  // locally and hand it back to the React Mini App when the user taps Back.
  var sessionToken = new URLSearchParams(window.location.hash.replace(/^#/, '')).get('session_token') || '';
  if (sessionToken) {
    try { localStorage.setItem('telegram_auth_token', sessionToken); } catch (_) {}
  }
  var videoId = params.get('video_id') || '';
  var contentId = params.get('content_id') || '';
  // Flashcards mined from this video link straight to the second the word
  // is spoken, so honour a ?start= offset when opening the player.
  var startAt = Math.max(0, parseInt(params.get('start') || '0', 10) || 0);
  // A flashcard links here for one word; we highlight it in the spoken line.
  var focusWord = params.get('word') || '';
  var returnTo = params.get('return_to') || '';
  var uiLanguage = (params.get('lang') || 'en').toLowerCase().split('-')[0];
  var copy = uiLanguage === 'fa' ? {
    back: 'بازگشت', closeWord: 'بستن',
    listen: 'تلفظ', save: 'ذخیره کارت', saved: 'ذخیره شد',
    connecting: 'در حال اتصال به یوتیوب…',
    watched: 'بخش‌های دیده‌شده', transcript: 'زیرنویس',
    fetchingSubtitles: 'در حال دریافت زیرنویس…',
    noSubtitles: 'زیرنویس این ویدیو در دسترس نیست. می‌توانید به تماشا ادامه دهید.',
    subtitlesFailed: 'دریافت زیرنویس ممکن نشد. می‌توانید به تماشا ادامه دهید.',
    subtitlesDelayed: 'دریافت زیرنویس طول کشیده است. کمی بعد بررسی کنید.',
    checkAgain: 'بررسی دوباره',
    videoUnavailable: 'ویدیو اینجا بارگذاری نشد. زیرنویس پایین همچنان کار می‌کند.',
    existingKept: 'کارت موجود حفظ شد',
    savedTitle: 'ذخیره‌شده از این ویدیو', review: 'مرور ←', building: 'در حال ساخت کارت…',
    loading: 'در حال ترجمه…', unavailable: 'ترجمه در دسترس نیست', chooseWord: 'یک کلمه را انتخاب کنید.',
    signIn: 'برای ذخیره، صفحه را داخل اپ باز کنید.', context: 'جمله'
  } : {
    back: 'Back', closeWord: 'Close',
    listen: 'Listen', save: 'Save card', saved: 'Saved',
    connecting: 'Connecting to YouTube…',
    watched: 'Watched sections', transcript: 'Transcript',
    fetchingSubtitles: 'Fetching subtitles…',
    noSubtitles: 'Subtitles aren’t available for this video. You can still watch it.',
    subtitlesFailed: 'Subtitles couldn’t be loaded. You can still watch the video.',
    subtitlesDelayed: 'Subtitles are taking longer. Check again later.',
    checkAgain: 'Check again',
    videoUnavailable: 'The video couldn’t load here. The subtitles below still work.',
    existingKept: 'Existing card kept',
    savedTitle: 'Saved from this video', review: 'Review →', building: 'Building card…',
    loading: 'Translating…', unavailable: 'Translation unavailable', chooseWord: 'Choose a word.',
    signIn: 'Open this page inside the app to save cards.', context: 'line'
  };
  document.documentElement.lang = uiLanguage;
  document.documentElement.dir = uiLanguage === 'fa' ? 'rtl' : 'ltr';
  document.getElementById('backBtn').title = copy.back;
  document.getElementById('backBtn').setAttribute('aria-label', copy.back);
  // Icon buttons: the label lives in title/aria-label, not the glyph.
  [['listenWord', copy.listen], ['saveWord', copy.save], ['closeWord', copy.closeWord]].forEach(function(pair) {
    var button = document.getElementById(pair[0]);
    button.title = pair[1];
    button.setAttribute('aria-label', pair[1]);
  });
  document.getElementById('videoStatus').textContent = copy.connecting;
  document.getElementById('watchProgress').setAttribute('aria-label', copy.watched);
  document.getElementById('transcriptTitle').textContent = copy.transcript;
  document.getElementById('transcriptRetry').textContent = copy.checkAgain;
  var sourceLanguage = 'fr';
  var videoTitleText = '';
  var selectedWord = '';
  var selectedCue = null;
  var selectedWordButton = null;
  var lookupCache = Object.create(null);
  // Folded fronts of words already saved from this video, for underlines.
  var savedKeys = Object.create(null);
  var lookupPending = Object.create(null);
  var lookupTimer = null;
  var lookupRequestId = 0;
  var userToken = params.get('ut') || '';
  var promiseId = params.get('pid') || '';
  var debug = params.get('debug') === '1';
  var baseUrl = window.location.origin;
  var openTime = Date.now();
  var segments = [];
  var currentStart = null;
  var player = null;
  var currentlyPlaying = false;
  // Watch progress is always tracked; there is no opt-out toggle any more.
  var trackingEnabled = true;
  var pollTimer = null;
  var lastPlayerTime = null;
  // Watched ranges not yet reported. The server adds up every report (watch
  // segments and time logged to the promise), so each report carries only
  // what is new since the last one — that is what makes reporting often safe.
  var unsentSegments = [];
  var immersiveLandscape = false;
  var videoDuration = 0;
  var cues = [];
  var activeCueIndex = -1;
  var cueButtons = [];
  var followTimer = null;
  var debugLog = document.getElementById('debugLog');
  if (debug && debugLog) debugLog.hidden = false;

  function formatCueTime(seconds) {
    var total = Math.max(0, Math.floor(Number(seconds) || 0));
    var minutes = Math.floor(total / 60);
    var secs = String(total % 60).padStart(2, '0');
    return minutes + ':' + secs;
  }

  // --- transcript follow -----------------------------------------------
  // The transcript is open by default and keeps the line being spoken
  // centred, so it doubles as the "current line" view. Tapping a line seeks
  // to it, which is also how a line is replayed — no separate card needed.

  function foldAccents(text) {
    try { return text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
    catch (e) { return text.toLowerCase(); }
  }

  // "une decennie" -> "decenn": drop the article, keep a stem short enough to
  // survive French inflection (decennie/decennies, aggraver/aggrave).
  function wordStem() {
    // Longest-first: `un|une` would strip "un" from "une decennie" and leave
    // "e", a stem that matches almost any line.
    var folded = foldAccents(focusWord);
    var stem = folded.replace(/^(une|un|les|le|la|des|du|de|d'|l')\s+/, '').split(/[\s(,]/)[0];
    if (stem.length < 3) stem = folded.split(/[\s(,]/)[0];
    return stem.length > 4 ? stem.slice(0, Math.max(4, stem.length - 2)) : stem;
  }

  function authHeaders() {
    var headers = {'Content-Type': 'application/json'};
    var token = sessionToken || '';
    try { token = localStorage.getItem('telegram_auth_token') || token; } catch (_) {}
    var initData = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData;
    if (token) headers.Authorization = 'Bearer ' + token;
    else if (initData) headers['X-Telegram-Init-Data'] = initData;
    return headers;
  }

  function translationTarget() {
    // The app's useful target languages are English and Persian. If the UI is
    // itself French, use English rather than showing the source unchanged.
    return uiLanguage === sourceLanguage ? 'en' : (uiLanguage === 'fa' ? 'fa' : 'en');
  }

  function closeWordTools() {
    var tools = document.getElementById('wordTools');
    if (tools) tools.hidden = true;
    if (selectedWordButton) selectedWordButton.classList.remove('is-selected');
    selectedWordButton = null;
    selectedWord = '';
    selectedCue = null;
  }

  function setWordStatus(text) {
    var status = document.getElementById('wordStatus');
    if (status) status.textContent = text || '';
  }

  function lookupWord(word, context) {
    var target = translationTarget();
    var key = sourceLanguage + ':' + target + ':' + foldAccents(word) + ':' + foldAccents(context || '');
    if (lookupCache[key]) return Promise.resolve(lookupCache[key]);
    if (lookupPending[key]) return lookupPending[key];
    var headers = authHeaders();
    if (!headers.Authorization && !headers['X-Telegram-Init-Data']) {
      return Promise.resolve({available: false, translation: ''});
    }
    var request = fetch(baseUrl + '/api/flashcards/lookup', {
      method: 'POST', headers: headers,
      body: JSON.stringify({word: word, context: context || '', source_language: sourceLanguage, target_language: target})
    }).then(function(response) {
      if (!response.ok) throw new Error('lookup HTTP ' + response.status);
      return response.json();
    }).then(function(data) {
      lookupCache[key] = data;
      return data;
    }).finally(function() { delete lookupPending[key]; });
    lookupPending[key] = request;
    return request;
  }

  function showWordTools(word, cue, wordButton, immediate) {
    var clean = (word || '').trim();
    if (!clean || clean.length < 2) return;
    if (selectedWordButton && selectedWordButton !== wordButton) selectedWordButton.classList.remove('is-selected');
    selectedWordButton = wordButton || null;
    if (selectedWordButton) selectedWordButton.classList.add('is-selected');
    selectedWord = clean;
    selectedCue = cue;
    var tools = document.getElementById('wordTools');
    document.getElementById('selectedWord').textContent = clean;
    document.getElementById('wordContext').textContent = formatCueTime(cue.start) + ' · ' + copy.context;
    document.getElementById('wordTranslation').textContent = copy.loading;
    document.getElementById('saveWord').disabled = true;
    setWordStatus('');
    tools.hidden = false;
    if (!immediate) {
      if (lookupTimer) clearTimeout(lookupTimer);
      lookupTimer = setTimeout(function() { fetchWordTranslation(clean); }, 320);
    } else {
      fetchWordTranslation(clean);
    }
  }

  function fetchWordTranslation(word) {
    var requestId = ++lookupRequestId;
    // The whole sentence, not one caption line, so the gloss picks the right sense.
    var context = selectedCue ? sentenceAround(selectedCue) : '';
    lookupWord(word, context).then(function(data) {
      if (requestId !== lookupRequestId || word !== selectedWord) return;
      document.getElementById('wordTranslation').textContent = data && data.available
        ? data.translation : copy.unavailable;
      document.getElementById('saveWord').disabled = false;
      if (!data || !data.available) setWordStatus(copy.unavailable);
    }).catch(function() {
      if (requestId !== lookupRequestId || word !== selectedWord) return;
      document.getElementById('wordTranslation').textContent = copy.unavailable;
      document.getElementById('saveWord').disabled = false;
      setWordStatus(copy.unavailable);
    });
  }

  function renderInteractiveText(target, text, cue) {
    target.textContent = '';
    // Keep whitespace and punctuation as text nodes; only lexical tokens are
    // buttons, so selecting a word never changes the sentence's appearance.
    var parts = String(text || '').split(/(\p{L}+(?:['’]\p{L}+)?)/gu);
    parts.forEach(function(part) {
      if (!part) return;
      if (/^\p{L}/u.test(part)) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'transcript-word';
        button.textContent = part;
        button.title = uiLanguage === 'fa' ? 'ترجمه و ذخیره کارت' : 'Translate and save card';
        // No hover trigger: passing the mouse over a line must not open the
        // card and fire a translation for every word it crosses.
        button.addEventListener('focus', function() { showWordTools(part, cue, button, true); });
        button.addEventListener('click', function(event) {
          event.stopPropagation();
          showWordTools(part, cue, button, true);
        });

    var utterance = new SpeechSynthesisUtterance(selectedWord);
    utterance.lang = sourceLanguage === 'fr' ? 'fr-FR' : (sourceLanguage === 'en' ? 'en-US' : sourceLanguage);

  // Automatic captions cut sentences into short lines ("frontières" alone),
  // so one line is often too little context to learn from. Grow the line
  // backwards and forwards to the nearest sentence boundary, capped so an
  // unpunctuated auto-caption stream still yields a readable snippet.
  function sentenceAround(cue) {
    var index = cues.indexOf(cue);
    if (index < 0) return cue.text;
    var ends = /[.!?…»"]\s*$/;
    var first = index, last = index;
    var length = function() {
      return cues.slice(first, last + 1).map(function(c) { return c.text; }).join(' ').length;
    };
    while (first > 0 && index - first < 2 && !ends.test(cues[first - 1].text) && length() < 160) first--;
    while (last < cues.length - 1 && last - index < 2 && !ends.test(cues[last].text) && length() < 200) last++;
    return cues.slice(first, last + 1).map(function(c) { return c.text.trim(); }).join(' ').replace(/\s+/g, ' ');
  }

  // A few lines either side, sent only to build the card (never stored):
  // enough for the model to recognise the expression a word belongs to.
  function passageAround(cue) {
    var index = cues.indexOf(cue);
    if (index < 0) return cue.text;
    return cues.slice(Math.max(0, index - 3), index + 4)
      .map(function(c) { return c.text.trim(); }).join(' ').replace(/\s+/g, ' ').slice(0, 1100);
  }

  function saveSelectedWord() {
    if (!selectedWord || !selectedCue) return;
    var headers = authHeaders();
    if (!headers.Authorization && !headers['X-Telegram-Init-Data']) {

      return;
    }
    var title = videoTitleText || ('YouTube ' + videoId);
    var deckTitle = title.replace(/[\\/:]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 100);
    var deckPath = (sourceLanguage === 'fr' ? 'French' : sourceLanguage.toUpperCase()) + '::Vidéos::' + deckTitle;
    var translation = document.getElementById('wordTranslation').textContent;
    var sourceUrl = 'https://www.youtube.com/watch?v=' + encodeURIComponent(videoId);
    var payload = {
      deck_path: deckPath,
      note_type: 'vocab',
      fields: {
        front: selectedWord,
        back: translation === copy.unavailable || translation === copy.loading ? '' : translation,
        example: sentenceAround(selectedCue),
        source_sentence: sentenceAround(selectedCue),
        source_video_id: videoId,
        source_title: title,
        source_start: selectedCue.start,
        source_url: sourceUrl,
        source_language: sourceLanguage,
        tags: ['youtube', sourceLanguage]

      method: 'POST', headers: headers, body: JSON.stringify(payload)
    }).then(function(response) {
      if (response.status === 401) throw new Error('auth');
      if (!response.ok) throw new Error('save HTTP ' + response.status);
      return response.json();
    }).then(function(data) {
      saveButton.textContent = '✓';

  // A flashcard links here for one word: emphasise it in its transcript line,
  // accent- and case-insensitively, so it is visible without a separate card.
  function markFocusWord(index) {
    var stem = wordStem();
    var row = cueButtons[index];
    if (!stem || !row) return;
    Array.prototype.forEach.call(row.querySelectorAll('.transcript-word'), function(word) {
      if (foldAccents(word.textContent).indexOf(stem) >= 0) word.classList.add('is-focus');

  function scrollCueWithinTranscript(button, behavior) {
    var list = document.getElementById('transcriptList');
    if (!list || !button) return;
    // scrollIntoView() may also scroll the document, which moves the player
    // off-screen as captions advance. Move only the transcript's own viewport.
    var listRect = list.getBoundingClientRect();
    var buttonRect = button.getBoundingClientRect();
    var targetTop = list.scrollTop + (buttonRect.top - listRect.top)
      - ((list.clientHeight - buttonRect.height) / 2);
    var maxTop = Math.max(0, list.scrollHeight - list.clientHeight);
    targetTop = Math.max(0, Math.min(maxTop, targetTop));
    if (typeof list.scrollTo === 'function') {
      list.scrollTo({top: targetTop, behavior: behavior || 'auto'});
    } else {
      list.scrollTop = targetTop;
    }
  }

  function setActiveCue(index) {
    if (index === activeCueIndex || index < 0 || index >= cues.length) return;
    if (cueButtons[activeCueIndex]) cueButtons[activeCueIndex].classList.remove('is-active');
    activeCueIndex = index;
    var button = cueButtons[index];
    if (button) {

  function cueIndexAt(seconds) {
    var lo = 0, hi = cues.length - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (cues[mid].start <= seconds) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return best;

  // The card links a second early on purpose, and our transcript can drift from
  // the one the word was mined out of, so find the line that actually says the
  // word near that point rather than trusting the timestamp alone.
  function initialCueIndex() {
    var fallback = cueIndexAt(startAt + 0.5);
    var stem = wordStem();
    if (!stem) return fallback;
    for (var i = 0; i < cues.length; i++) {
      if (cues[i].start < startAt - 4) continue;
      if (cues[i].start > startAt + 20) break;
      if (foldAccents(cues[i].text).indexOf(stem) >= 0) return i;
    }
    return fallback;
  }

  function followTick() {
    if (!cues.length || !player || typeof player.getCurrentTime !== 'function') return;
    // Only chase the clock while the video is actually running. Paused, the
    // line must stay put: it is the one the flashcard linked to, and the
    // player sits a beat before it by design.
    try {
      if (!window.YT || !YT.PlayerState || player.getPlayerState() !== YT.PlayerState.PLAYING) return;
    } catch (e) { return; }
    var t;
    try { t = player.getCurrentTime(); } catch (e) { return; }
    setActiveCue(cueIndexAt(t));
  }

  function startFollowing() {
    if (followTimer) return;
    // Faster than the 1s stats poll: a caption line can be shorter than a second.
    followTimer = setInterval(followTick, 250);
    followTick();

  var transcriptPolls = 0;
  var transcriptPollTimer = null;
  window.addEventListener('pagehide', function() { clearTimeout(transcriptPollTimer); });
  function showTranscriptStatus(message, canRetry) {
    document.getElementById('transcript').hidden = false;

    document.getElementById('transcriptRetry').hidden = !canRetry;
  }
  document.getElementById('transcriptRetry').addEventListener('click', function() {
    transcriptPolls = 0;
    loadTranscript();
  });
  function loadTranscript() {
    clearTimeout(transcriptPollTimer);
    showTranscriptStatus(copy.fetchingSubtitles, false);
    var headers = authHeaders();
    var endpoint = contentId
      ? '/api/content/' + encodeURIComponent(contentId) + '/transcript'
      : '/api/youtube/' + encodeURIComponent(videoId) + '/transcript';
    fetch(baseUrl + endpoint, { headers: headers })
      .then(function(response) {
        if (!response.ok) throw new Error('Transcript request failed');
        return response.json();
      })
      .then(function(data) {
        if (!data || !data.available || !data.cues || !data.cues.length) {
          if (data && data.pending) {
            if (transcriptPolls++ < 90) transcriptPollTimer = setTimeout(loadTranscript, 10000);

          } else {
            showTranscriptStatus(data && data.status === 'unavailable' ? copy.noSubtitles : copy.subtitlesFailed, false);

        var panel = document.getElementById('transcript');
        var list = document.getElementById('transcriptList');
        var title = document.getElementById('transcriptTitle');
        title.textContent = (uiLanguage === 'fa' ? 'زیرنویس' : 'Transcript') + (data.source === 'automatic' ? (uiLanguage === 'fa' ? ' · خودکار' : ' · automatic') : '');
        document.getElementById('transcriptStatus').hidden = true;
        list.hidden = false;
        list.innerHTML = '';
        cues = data.cues.map(function(cue) {
          return {start: Number(cue.start) || 0, end: Number(cue.end) || 0, text: cue.text || ''};
        });
        cueButtons = [];
        cues.forEach(function(cue, index) {
          var row = document.createElement('div');
          row.className = 'transcript-cue';
          var jump = document.createElement('button');
          jump.type = 'button';
          jump.className = 'transcript-jump transcript-time';
          jump.textContent = formatCueTime(cue.start);
          var text = document.createElement('span');
          text.className = 'transcript-text';
          text.dir = 'auto';
          renderInteractiveText(text, cue.text, cue);
          row.appendChild(jump);
          row.appendChild(text);
          row.addEventListener('click', function() {
            if (player && typeof player.seekTo === 'function') { player.seekTo(cue.start, true); player.playVideo(); }
            setActiveCue(index);
          });
          jump.addEventListener('click', function(event) {
            event.stopPropagation();
            if (player && typeof player.seekTo === 'function') { player.seekTo(cue.start, true); player.playVideo(); }

  function setRootPxVar(name, value) {

  function syncTelegramLayoutVars() {

      if (!window.Telegram || !window.Telegram.WebApp) return;

  function installTelegramLayoutSync() {

      var webApp = window.Telegram.WebApp;

  function updateOrientationMode() {

    if (!isMobileDevice) return;
    var landscape = isLandscape();

  document.getElementById('yt').src =
    'https://www.youtube.com/embed/' + videoId +
    '?enablejsapi=1&playsinline=1&origin=' + encodeURIComponent(baseUrl) +

  function pushSegment(start, end) {
    if (typeof start !== "number" || typeof end !== "number") return;
    if (!isFinite(start) || !isFinite(end)) return;

    // visual completion bar uses the union of watched ranges.
    unsentSegments.push([start, end]);
    segments = mergeWatchedSegments(segments.concat([[start, end]]));
    updateProgressDisplay();
  }

  function mergeWatchedSegments(ranges) {
    var merged = [];
    ranges.filter(function(seg) {
      return Array.isArray(seg) && seg.length === 2 && Number.isFinite(seg[0]) && Number.isFinite(seg[1]) && seg[1] > seg[0];
    }).sort(function(a, b) { return a[0] - b[0]; }).forEach(function(seg) {
      var last = merged[merged.length - 1];
      if (last && seg[0] <= last[1]) last[1] = Math.max(last[1], seg[1]);
      else merged.push(seg.slice());
    });
    return merged;
  }

  function loadWatchProgress() {
    var headers = authHeaders();
    if (userToken) headers['X-YouTube-User-Token'] = userToken;
    var endpoint = '/api/youtube/' + encodeURIComponent(videoId) + '/progress';
    if (contentId) endpoint += '?content_id=' + encodeURIComponent(contentId);
    fetch(baseUrl + endpoint, {headers: headers})
      .then(function(response) { return response.ok ? response.json() : null; })
      .then(function(data) {
        if (!data) return;
        if (!videoDuration && Number(data.duration_seconds) > 0) videoDuration = Number(data.duration_seconds);
        // Loading may finish after playback starts. Keep local coverage, but
        // never add already-saved ranges to the outgoing watch reports.
        segments = mergeWatchedSegments(segments.concat(data.segments || []));
        updateProgressDisplay();
      }).catch(function() { /* Player metadata still provides a fallback. */ });
  }

  function updateProgressDisplay() {
    var container = document.getElementById('watchProgress');
    if (!container) return;
    if (!videoDuration) { container.hidden = true; return; }
    container.hidden = false;
    container.innerHTML = '';
    var watched = 0;
    segments.forEach(function(seg) {
      var start = Math.max(0, seg[0]);
      var end = Math.min(videoDuration, seg[1]);
      var left = (start / videoDuration) * 100;
      var width = ((end - start) / videoDuration) * 100;
      if (width <= 0) return;
      watched += end - start;
      var div = document.createElement('div');
      div.className = 'progress-segment';
      div.style.left = Math.max(0, Math.min(100, left)) + '%';
      div.style.width = Math.max(0, Math.min(100 - Math.max(0, left), width)) + '%';
      container.appendChild(div);

  function markPlaying(t) {
    if (!trackingEnabled) return;

    }
    currentlyPlaying = true;
    currentStart = t;
    dlog("play @" + t.toFixed(2));
  }

  function markNotPlaying(t) {
    if (!currentlyPlaying) return;
    if (typeof t !== "number" || !isFinite(t)) {
      try { t = player ? player.getCurrentTime() : 0; } catch (e) { t = 0; }
    }
    currentlyPlaying = false;
    if (currentStart != null) pushSegment(currentStart, t);
    dlog("stop @" + t.toFixed(2));
    currentStart = null;
  }

  function pollTick() {

      dlog("poll: getCurrentTime failed: " + e);
      return;
    }
    var state = null;
    try {
      state = player.getPlayerState();
    } catch (e) {}

    var advanced = (lastPlayerTime != null) && (t > (lastPlayerTime + 0.2));
    var isPlaying = false;
    if (typeof state === "number" && window.YT && YT.PlayerState) {
      isPlaying = state === YT.PlayerState.PLAYING;
    }
    if (!isPlaying && advanced) isPlaying = true;

    var jumped = (lastPlayerTime != null) && (Math.abs(t - lastPlayerTime) > 2.5);
    if (currentlyPlaying && jumped && lastPlayerTime != null && currentStart != null) {
      pushSegment(currentStart, lastPlayerTime);
      currentStart = t;
      dlog("jump: " + lastPlayerTime.toFixed(2) + " -> " + t.toFixed(2));
    }

    if (isPlaying) markPlaying(t);
    else markNotPlaying(t);
    lastPlayerTime = t;
  }

  function startPolling() {
    if (pollTimer) return;

    pollTimer = null;

  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  setTimeout(function() {
    if (!window.YT || !window.YT.Player) dlog("YT API not loaded (timeout)");
  }, 5000);

  window.onYouTubeIframeAPIReady = function() {
    dlog("YT iframe API ready");
    player = new YT.Player('yt', {
      events: {
        onReady: function() {
          dlog("player ready");
          playerReady = true;
          clearTimeout(videoStatusTimer);
          if (videoStatus) videoStatus.hidden = true;
          if (startAt > 0) {
            try { player.seekTo(startAt, true); } catch (e) {}
          }
          try {
            var dur = player.getDuration();
            if (dur && isFinite(dur) && dur > 0) {
              videoDuration = dur;
              dlog("duration=" + dur.toFixed(1));
              updateProgressDisplay();
            }
          } catch (e) {}
        },
        onStateChange: function(event) {
          dlog("state=" + event.data);
          // Capture duration once the video starts playing (may not be available in onReady).
          if (!videoDuration) {
            try {
              var dur = player.getDuration();
              if (dur && isFinite(dur) && dur > 0) {
                videoDuration = dur;
                updateProgressDisplay();
              }
            } catch (e) {}
          }
          if (!trackingEnabled) return;
          if (event.data === YT.PlayerState.PLAYING) {
            try { markPlaying(player.getCurrentTime()); } catch (e) { markPlaying(); }
          } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
            try { markNotPlaying(player.getCurrentTime()); } catch (e) { markNotPlaying(); }
            flushStats('pause');
          }
        },
        onError: function(event) {
          dlog("player error=" + (event && event.data != null ? event.data : "unknown"));
        }
      }
    });
  };

  // Close the range being watched right now at the current time, without
  // stopping playback, so it can be reported; watching carries on from here.
  function cutOpenSegment() {
    if (!currentlyPlaying || currentStart == null) return;
    var t;
    try { t = player.getCurrentTime(); } catch (e) { return; }
    if (typeof t !== "number" || !isFinite(t)) return;
    pushSegment(currentStart, t);
    currentStart = t;
  }

  // Report whatever has been watched since the last report. Called often —
  // on pause, when the app goes to the background, every couple of minutes,
  // and on close — because a phone can kill the page without any "closing"
  // event, and progress used to be saved only on close.
  function takeStatsPayload(reason) {
    cutOpenSegment();
    if (!unsentSegments.length) return null;
    var pending = unsentSegments;
    unsentSegments = [];
    var watchedSeconds = 0;
    pending.forEach(function(seg) { watchedSeconds += Math.max(0, seg[1] - seg[0]); });
    return {
      init_data: window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData : '',
      user_token: userToken,
      stats: {
        report_id: crypto.randomUUID(),
        video_id: videoId,
        content_id: contentId || null,
        duration_seconds: videoDuration || null,
        promise_id: promiseId,
        time_spent_seconds: watchedSeconds,
        page_open_seconds: (Date.now() - openTime) / 1000,
        segments: pending,
        closed_via: reason
      }
    };
  }

  // WATCH_REPORT_OUTBOX_START (also exercised by the offline JS tests)
  var watchOutbox = [];
  var watchSending = null;
  var watchStorageKey = '';
  function watchAuthScope() {
    var h = authHeaders();
    return h.Authorization || h['X-Telegram-Init-Data'] || userToken || '';
  }
  var watchInitialScope = watchAuthScope();
  var watchOutboxReady = crypto.subtle.digest('SHA-256', new TextEncoder().encode(watchInitialScope)).then(function(hash) {
    var fingerprint = Array.from(new Uint8Array(hash)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
    // Tab-scoped and account-bound: never replay somebody else's saved queue.
    // Only stats are persisted, never credentials.
    watchStorageKey = 'xaana-watch:' + fingerprint + ':' + videoId + ':' + contentId;
    try { watchOutbox = JSON.parse(sessionStorage.getItem(watchStorageKey) || '[]'); } catch (_) {}
    if (!Array.isArray(watchOutbox)) watchOutbox = [];
  }).catch(function() { /* in-memory retries still work without storage */ });
  function persistWatchOutbox() {
    try { if (watchStorageKey) sessionStorage.setItem(watchStorageKey, JSON.stringify(watchOutbox)); } catch (_) {}
  }
  function watchSaveStatus(failed) {
    var el = document.getElementById('watchSaveStatus');
    if (!el) return;
    el.hidden = !failed;
    el.textContent = uiLanguage === 'fa'
      ? 'پیشرفت هنوز ذخیره نشده؛ با اتصال و ورود دوباره تلاش می‌کنیم.'
      : 'Progress not saved yet. Retrying when connected and signed in.';
  }
  function flushStats(reason) {
    // Capture before awaiting anything: pagehide may be our final opportunity.
    var payload = takeStatsPayload(reason);
    return watchOutboxReady.then(function() {
      if (payload) { watchOutbox.push(payload.stats); persistWatchOutbox(); }
      if (watchSending) return watchSending;
      watchSending = (async function() {
        while (watchOutbox.length) {
          if (!watchInitialScope || watchAuthScope() !== watchInitialScope) {
            watchSaveStatus(true);
            return false;
          }
          var stats = watchOutbox[0];
          var controller = new AbortController();
          var timeout = setTimeout(function() { controller.abort(); }, 15000);
          try {
            var response = await fetch(baseUrl + '/api/youtube/report_stats', {
              method: 'POST', headers: authHeaders(), keepalive: true, signal: controller.signal,
              body: JSON.stringify({stats: stats, user_token: userToken,
                init_data: window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData : ''})
            });
            if (!response.ok || !(await response.json()).ok) throw new Error('save rejected');
            watchOutbox.shift();
            persistWatchOutbox();
            watchSaveStatus(false);
          } catch (_) {
            watchSaveStatus(true);
            return false;
          } finally {
            clearTimeout(timeout);
          }
        }
        return true;
      })().finally(function() { watchSending = null; });
      return watchSending;
    });
  }
  // WATCH_REPORT_OUTBOX_END

  setInterval(function() { flushStats('interval'); }, 30000);
  window.addEventListener('online', function() { flushStats('online'); });
  window.addEventListener('storage', function(event) {
    if (event.key !== 'telegram_auth_token' || event.oldValue === event.newValue) return;
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) return;
    // Preserve pending progress in its old-account outbox, then leave the old
    // account's content. flushStats refuses to send it with the new identity.
    flushStats('account-switch').finally(function() { window.location.replace('/dashboard'); });
  });
  watchOutboxReady.then(function() { flushStats('retry'); });
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') flushStats('hidden');
  });
  window.addEventListener('pagehide', function() {
    flushStats('pagehide');
    stopPolling();
  });

  function applySavedMarks() {
    Array.prototype.forEach.call(document.querySelectorAll('.transcript-word'), function(word) {
      word.classList.toggle('is-saved', !!savedKeys[foldAccents(word.textContent)]);
    });
  }

  function loadSavedWords() {
    var headers = authHeaders();
    if (!headers.Authorization && !headers['X-Telegram-Init-Data']) return;
    fetch(baseUrl + '/api/flashcards/video-notes?video_id=' + encodeURIComponent(videoId), { headers: headers })
      .then(function(response) { return response.ok ? response.json() : null; })
      .then(function(data) {
        var items = (data && data.items) || [];
        savedKeys = Object.create(null);
        items.forEach(function(item) { if (item.front) savedKeys[foldAccents(item.front)] = true; });
        applySavedMarks();
        var section = document.getElementById('savedWords');
        var list = document.getElementById('savedList');
        list.innerHTML = '';
        section.hidden = items.length === 0;
        if (!items.length) return;
        document.getElementById('savedTitle').textContent = copy.savedTitle + ' (' + items.length + ')';
        items.forEach(function(item) {
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'saved-chip';
          var front = document.createElement('span');
          front.dir = 'auto';
          front.textContent = item.front;
          chip.appendChild(front);
          if (item.back) {
            var back = document.createElement('span');
            back.className = 'saved-chip-back';
            back.dir = 'auto';
            back.textContent = item.back;
            chip.appendChild(back);
          }
          if (typeof item.start === 'number') {
            chip.title = formatCueTime(item.start);
            chip.addEventListener('click', function() {
              if (player && typeof player.seekTo === 'function') { player.seekTo(Math.max(0, item.start - 0.5), true); player.playVideo(); }
              setActiveCue(cueIndexAt(item.start));
            });
          }
          list.appendChild(chip);
        });
        // Review the deck most of these words live in (a word saved earlier
        // from elsewhere keeps its own deck, so pick the majority).
        var counts = {};
        items.forEach(function(item) { counts[item.deck_id] = (counts[item.deck_id] || 0) + 1; });
        var deckId = Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a]; })[0];
        var deck = items.filter(function(item) { return item.deck_id === deckId; })[0];
        var review = document.getElementById('savedReview');
        review.textContent = copy.review;
        review.onclick = function(event) {
          event.preventDefault();
          openAppPath('/flashcards?deck=' + encodeURIComponent(deck.deck_id) + '&name=' + encodeURIComponent(deck.deck_name));
        };
      })
      .catch(function() { /* the strip is optional; the player keeps working */ });
  }

  // Leave the player for another app route, keeping the session the same way
  // the Back button does (Telegram Desktop may not re-send initData).
  function openAppPath(path) {
    flushStats('navigate').then(function(saved) {
      if (saved) window.location.assign(path + (sessionToken ? '#session_token=' + encodeURIComponent(sessionToken) : ''));
    });
  }

  async function returnToApp() {
    if (!(await flushStats('back'))) return;
    var appDestination = returnTo.charAt(0) === '/' && returnTo.charAt(1) !== '/'
      ? returnTo
      : '/my-contents';
    if (sessionToken) {
      // Go to a known authenticated route instead of relying on the Telegram
      // webview history, which may reopen the Mini App without initData.
      window.location.replace(appDestination + '#session_token=' + encodeURIComponent(sessionToken));
      return;
    }
    if (returnTo.charAt(0) === '/' && returnTo.charAt(1) !== '/') {
      window.location.replace(returnTo);
      return;
    }
    var cameFromThisApp = false;
    try {
      cameFromThisApp = Boolean(document.referrer) && new URL(document.referrer).origin === window.location.origin;
    } catch (e) {}
    if (cameFromThisApp || (window.history.state && Number(window.history.state.idx) > 0)) {
      window.history.back();
    } else {
      window.location.replace('/my-contents');
    }
  }

  document.getElementById('backBtn').addEventListener('click', returnToApp);

  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
    window.Telegram.WebApp.MainButton.hide();
    syncTelegramLayoutVars();
    setTimeout(updateOrientationMode, 60);
  }

  // There is no app-level full-screen button: YouTube's own control in the
  // frame does that, and a second one overlapped and fought it. Rotating a
  // phone still switches to the immersive landscape layout automatically.

  loadTranscript();
  loadWatchProgress();
  loadSavedWords();

  // Safe-area insets change when the frame enters or leaves full screen.
  document.addEventListener('fullscreenchange', syncTelegramLayoutVars);
  document.addEventListener('webkitfullscreenchange', syncTelegramLayoutVars);
})();
  </script>
</body>
</html>
